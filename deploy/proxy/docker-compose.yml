# 共享的 Caddy（口径第 24 节）：一台服务器上所有客户共用，按子域名转到各家的应用；有域名时自动申请 HTTPS 证书。
# 站点配置一家一个文件，放在 $ERP_ROOT/proxy/sites/<代号>.caddy（deploy/tenant-new.sh 写），加了客户以后 reload：
#   docker compose -p erp-proxy -f deploy/proxy/docker-compose.yml exec caddy caddy reload --config /etc/caddy/Caddyfile
name: erp-proxy

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${ERP_ROOT:-/srv/erp}/proxy/sites:/etc/caddy/sites:ro
      - caddy_data:/data
    networks: [erp-proxy]

networks:
  # 共享网络由 deploy/tenant-new.sh 先建好（各家的应用也接在上面），这里只是用它
  erp-proxy:
    name: erp-proxy
    external: true

volumes:
  caddy_data:
