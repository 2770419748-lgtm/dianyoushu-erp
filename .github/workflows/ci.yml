# 每次推送和每个 PR 都跑：lint、类型检查、生产构建、全部测试，最后打生产镜像、起容器查健康检查。
# 测试连一个临时的 PostgreSQL（GitHub 给每次运行起一个全新的），先建表、灌演示数据，
# 所以连库测试、并发测试、会写库的回归测试（RUN_DESTRUCTIVE_TESTS=1）在 CI 上都会真跑，不会被跳过。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci?schema=public
      SESSION_SECRET: ci-only-placeholder-not-a-real-secret
      # 个人信息加密钥匙（口径第 20 节）：CI 专用的公开值，生产环境会被拒绝
      DATA_ENCRYPTION_KEY: Y2ktb25seS1kYXRhLWVuY3J5cHRpb24ta2V5LTMyYnk=
      DATA_INDEX_KEY: Y2ktb25seS1kYXRhLWluZGV4LWtleS0zMmJ5dGVzISE=
      RUN_DESTRUCTIVE_TESTS: "1"
    steps:
      - uses: actions/checkout@v4

      # pnpm 版本从 package.json 的 packageManager 字段读
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖（会自动 prisma generate）
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: 类型检查
        run: pnpm typecheck

      - name: 建表
        run: pnpm exec prisma migrate deploy

      - name: 灌演示数据（种子 + 3 个月模拟经营数据，带自检）
        run: pnpm db:reset

      - name: 测试（含连库、并发、回归）
        run: pnpm test

      - name: 对账自检（测试跑完账还对得上）
        run: pnpm db:check

      # 浏览器端到端测试（tests/e2e，2026-10-23 起进 CI）：用 Playwright 自带的 Chromium，开发服务器由 Playwright 自己起
      - name: 装浏览器（端到端测试用）
        run: pnpm exec playwright install --with-deps chromium

      - name: 浏览器端到端测试
        run: pnpm test:e2e

      - name: 浏览器测试失败时留下现场
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results
          retention-days: 7

      - name: 对账自检（浏览器测试跑完账还对得上）
        run: pnpm db:check

      - name: 生产构建
        run: pnpm build

      # 生产镜像（Dockerfile）：每次都打一遍，再连上面的临时库起一个容器，健康检查和登录页都要通。
      # 服务器上的 compose、Caddy、备份要等有服务器再实跑（docs/部署.md）
      - name: 打生产镜像
        run: docker build -t dianyoushu-erp:ci .

      - name: 起容器查健康检查
        run: |
          DB_PW=$(openssl rand -hex 16)
          SECRET=$(openssl rand -base64 32)
          ENC_KEY=$(openssl rand -base64 32)
          IDX_KEY=$(openssl rand -base64 32)
          echo "::add-mask::$DB_PW"
          echo "::add-mask::$SECRET"
          echo "::add-mask::$ENC_KEY"
          echo "::add-mask::$IDX_KEY"
          RO_PW=$(openssl rand -hex 16)
          echo "::add-mask::$RO_PW"
          # 分账号（口径第 20 节）：用部署时同一个脚本建 erp_app（应用用，只能增删改查）和 erp_readonly（只读）
          PGHOST=localhost PGUSER=postgres PGPASSWORD=postgres POSTGRES_DB=ci DB_OWNER=postgres \
            APP_DB_PASSWORD="$DB_PW" READONLY_DB_PASSWORD="$RO_PW" sh docker/db-roles.sh
          # 容器用的是新生成的随机钥匙，和灌演示数据时的 CI 钥匙不一样：另建一个空库给它（像一次全新部署），
          # 灌了数据的 ci 库留着测“钥匙对不上拒绝启动”
          PGPASSWORD=postgres psql -h localhost -U postgres -d ci -q -c "CREATE DATABASE ci_app"
          DATABASE_URL="postgresql://postgres:postgres@localhost:5432/ci_app?schema=public" pnpm exec prisma migrate deploy > /dev/null
          PGHOST=localhost PGUSER=postgres PGPASSWORD=postgres POSTGRES_DB=ci_app DB_OWNER=postgres \
            APP_DB_PASSWORD="$DB_PW" READONLY_DB_PASSWORD="$RO_PW" sh docker/db-roles.sh
          # 业务账号删不了表，只读账号写不进去，但都能查
          if PGPASSWORD="$DB_PW" psql -h localhost -U erp_app -d ci -q -c "DROP TABLE audit_logs" 2>/dev/null; then echo "erp_app 竟然能删表"; exit 1; fi
          if PGPASSWORD="$RO_PW" psql -h localhost -U erp_readonly -d ci -q -c "DELETE FROM audit_logs WHERE false" 2>/dev/null; then echo "erp_readonly 竟然能写"; exit 1; fi
          PGPASSWORD="$RO_PW" psql -h localhost -U erp_readonly -d ci -At -c "SELECT count(*) > 0 FROM customers" | grep -q t
          # 个人信息钥匙对不上拒绝启动（口径第 20 节）：随机钥匙连灌过数据的 ci 库，容器要自己退出、日志里说钥匙对不上
          if timeout 90 docker run --rm --network host \
            -e DATABASE_URL="postgresql://erp_app:$DB_PW@localhost:5432/ci?schema=public" \
            -e SESSION_SECRET="$SECRET" -e DEMO_MODE=1 -e DATA_ENCRYPTION_KEY="$ENC_KEY" -e DATA_INDEX_KEY="$IDX_KEY" \
            dianyoushu-erp:ci > /tmp/mismatch.log 2>&1; then echo "钥匙对不上竟然启动了"; exit 1; fi
          grep -q "个人信息钥匙对不上，拒绝启动" /tmp/mismatch.log
          echo "钥匙对不上：拒绝启动"
          # 先没库、再有库（服务器重启时应用常比数据库先起来，快核第 63 条）：容器连一个暂时没人听的端口，
          # 8 秒后才把这个端口转到真库；应用要自己等到库、核对通过、能正常服务，不能一直 500
          docker run -d --name erp-late --network host -e PORT=3001 \
            -e DATABASE_URL="postgresql://erp_app:$DB_PW@localhost:5439/ci_app?schema=public" \
            -e SESSION_SECRET="$SECRET" -e DEMO_MODE=1 -e DATA_ENCRYPTION_KEY="$ENC_KEY" -e DATA_INDEX_KEY="$IDX_KEY" \
            dianyoushu-erp:ci
          sleep 8
          node -e "const net=require('net');net.createServer(c=>{const d=net.connect(5432,'127.0.0.1');c.pipe(d);d.pipe(c);c.on('error',()=>d.destroy());d.on('error',()=>c.destroy())}).listen(5439)" &
          PROXY=$!
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:3001/api/health > /dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:3001/api/health
          echo
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/login)" = "200"
          docker logs erp-late 2>&1 | grep -q "启动时连不上数据库"
          docker rm -f erp-late > /dev/null
          kill $PROXY
          echo "先没库再有库：等到库以后正常服务"
          # 应用容器连业务账号（生产模式下会拒绝默认密码 postgres），用空库 ci_app，第一次启动记下这套钥匙
          docker run -d --name erp-ci --network host \
            -e DATABASE_URL="postgresql://erp_app:$DB_PW@localhost:5432/ci_app?schema=public" \
            -e SESSION_SECRET="$SECRET" -e DEMO_MODE=1 \
            -e DATA_ENCRYPTION_KEY="$ENC_KEY" -e DATA_INDEX_KEY="$IDX_KEY" \
            dianyoushu-erp:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health; then echo; break; fi
            sleep 2
          done
          curl -fsS http://localhost:3000/api/health
          echo
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/login)" = "200"
          echo "登录页 200"

      # 备份加密（口径第 20 节）：用 compose 里同一个镜像和脚本备份临时库，备份文件不解密就读不了，解开后 pg_restore 能列出表
      - name: 加密备份能备能解
        run: |
          docker build -q -t dianyoushu-erp-backup:ci -f docker/backup.Dockerfile docker > /dev/null
          PASS=$(openssl rand -base64 24)
          echo "::add-mask::$PASS"
          mkdir -p ci-backups
          RUN_BACKUP="docker run --rm --network host -e PGHOST=localhost -e PGUSER=postgres -e PGPASSWORD=postgres -e PGDATABASE=ci -v $PWD/docker/backup.sh:/backup.sh:ro"
          $RUN_BACKUP -e BACKUP_PASSPHRASE="$PASS" -v "$PWD/ci-backups:/backups" dianyoushu-erp-backup:ci bash /backup.sh now
          # 没口令拒绝备份
          if $RUN_BACKUP dianyoushu-erp-backup:ci bash /backup.sh now 2>/dev/null; then echo "没口令竟然备份了"; exit 1; fi
          # 盘满（只给 64KB 的 /backups）：要报失败，不能留下文件，也不能记“完成”
          if $RUN_BACKUP -e BACKUP_PASSPHRASE="$PASS" --tmpfs /backups:size=64k dianyoushu-erp-backup:ci bash -c 'bash /backup.sh now; s=$?; ls -A /backups; exit $s' > /tmp/full.log 2>&1; then echo "盘满竟然备份成功了"; cat /tmp/full.log; exit 1; fi
          if grep -q "完成" /tmp/full.log || grep -q "dump" /tmp/full.log; then echo "盘满留下了文件或记了完成"; cat /tmp/full.log; exit 1; fi
          # 备份文件只有属主（容器里的 root）能读，核对也在同一个镜像里做：
          # 只有属主能读；不解密 pg_restore 认不出来；错口令解不开；对的口令解开整份读得完（截断的会报错）、有 customers 表
          docker run --rm -e PASS="$PASS" -v "$PWD/ci-backups:/backups:ro" dianyoushu-erp-backup:ci bash -c '
            set -eo pipefail
            f=$(ls /backups/*.dump.enc | head -1)
            test "$(stat -c %a "$f")" = "600"
            if pg_restore -f /dev/null "$f" 2>/dev/null; then echo "备份没加密"; exit 1; fi
            if openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass pass:wrong-passphrase -in "$f" 2>/dev/null | pg_restore -f /dev/null 2>/dev/null; then echo "错口令竟然解开了"; exit 1; fi
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:PASS -in "$f" -out /tmp/ok.dump
            pg_restore -f /dev/null /tmp/ok.dump
            pg_restore --list /tmp/ok.dump > /tmp/ok.list
            grep -q "TABLE public customers" /tmp/ok.list
          '
          echo "加密备份：备得出、只有属主能读、没口令拒绝、盘满报失败不留文件、错口令解不开、对的口令能完整恢复"

      - name: 容器日志（上一步失败时看）
        if: failure()
        run: docker logs erp-ci || true
