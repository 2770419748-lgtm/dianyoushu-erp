# 一台服务器跑四样：数据库、应用、Caddy（自动申请 HTTPS 证书）、定时备份。
# 用法见 docs/部署.md。密码和密钥都放同目录的 .env（不进仓库），这里只引用变量名。

# 企业微信（口径第 12 节）：WECOM_ENABLED=1 才真对接，其余是企业微信后台给的值，都写在 .env 里
x-wecom-env: &wecom-env
  WECOM_ENABLED: ${WECOM_ENABLED:-0}
  WECOM_CORP_ID: ${WECOM_CORP_ID:-}
  WECOM_APP_SECRET: ${WECOM_APP_SECRET:-}
  WECOM_AGENT_ID: ${WECOM_AGENT_ID:-}
  WECOM_CALLBACK_TOKEN: ${WECOM_CALLBACK_TOKEN:-}
  WECOM_CALLBACK_AES_KEY: ${WECOM_CALLBACK_AES_KEY:-}

# 每个容器的日志最多 5 个文件 × 50MB，写满自动滚动，不会把硬盘写满
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  db:
    image: postgres:17
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?在 .env 里设置 POSTGRES_PASSWORD}
      POSTGRES_DB: dianyoushu_erp
      # 分账号（口径第 20 节）：第一次初始化时建 erp_app（应用用，只能增删改查）和 erp_readonly（只读）
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?在 .env 里设置 APP_DB_PASSWORD}
      READONLY_DB_PASSWORD: ${READONLY_DB_PASSWORD:?在 .env 里设置 READONLY_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db-roles.sh:/docker-entrypoint-initdb.d/10-db-roles.sh:ro
      - ./docker/db-roles.sh:/db-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d dianyoushu_erp"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    logging: *default-logging
    environment:
      # 应用用业务账号 erp_app：只能增删改查，改不了表结构（口径第 20 节）；迁移走 tools 服务（表的所有者 erp）
      DATABASE_URL: postgresql://erp_app:${APP_DB_PASSWORD}@db:5432/dianyoushu_erp?schema=public
      SESSION_SECRET: ${SESSION_SECRET:?在 .env 里设置 SESSION_SECRET}
      # 个人信息加密的两把钥匙（口径第 20 节），丢了数据就解不开，另外离线存一份
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?在 .env 里设置 DATA_ENCRYPTION_KEY}
      DATA_INDEX_KEY: ${DATA_INDEX_KEY:?在 .env 里设置 DATA_INDEX_KEY}
      # 必须在 .env 里写明：演示站 1，真给门店用 0（见 docs/部署.md 上线前检查清单）；应用启动时也会检查
      DEMO_MODE: ${DEMO_MODE:?在 .env 里写明 DEMO_MODE：演示站 1，真给门店用 0}
      <<: *wecom-env
      # 应用在 Caddy 后面，X-Forwarded-For 由 Caddy 写入、可信，登录限流按 IP + 用户名
      TRUST_PROXY: "1"
    depends_on:
      db:
        condition: service_healthy
    # 镜像里没有 curl，用 node 自带的 fetch 请求健康检查接口（数据库不通会返回 503）
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # 备案没下来时用 IP 访问：SITE_ADDRESS 设成 :80；有域名后设成域名，Caddy 自动上 HTTPS
  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app

  # 每天凌晨 3 点备份数据库到 ./backups，加密（口径第 20 节），留 14 天；手动备份：docker compose exec backup bash /backup.sh now
  backup:
    build:
      context: ./docker
      dockerfile: backup.Dockerfile
    restart: unless-stopped
    logging: *default-logging
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Shanghai
      # 备份加密口令，另外离线存一份，丢了备份打不开
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?在 .env 里设置 BACKUP_PASSPHRASE}
    entrypoint: ["bash", "/backup.sh"]
    volumes:
      - ./docker/backup.sh:/backup.sh:ro
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

  # 迁移、灌演示数据、对账、每日任务：docker compose run --rm tools pnpm exec prisma migrate deploy / pnpm db:check / pnpm daily
  tools:
    build:
      context: .
      target: build
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql://erp:${POSTGRES_PASSWORD}@db:5432/dianyoushu_erp?schema=public
      ALLOW_DB_RESET: "1"
      DEMO_MODE: ${DEMO_MODE:?在 .env 里写明 DEMO_MODE：演示站 1，真给门店用 0}
      # 每日任务（pnpm daily）要用企业微信配置
      <<: *wecom-env
      # 压测（pnpm load-test）要用它签登录 cookie
      SESSION_SECRET: ${SESSION_SECRET}
      # 灌演示数据、导入要加密手机号，必须和应用用同一套钥匙
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?在 .env 里设置 DATA_ENCRYPTION_KEY}
      DATA_INDEX_KEY: ${DATA_INDEX_KEY:?在 .env 里设置 DATA_INDEX_KEY}
    # 全量导出（pnpm export:all）写到服务器的 ./exports；里面是明文个人信息，交接完就删
    volumes:
      - ./exports:/app/exports
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
